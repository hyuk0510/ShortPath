name: iOS Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 최신 Xcode 선택
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 테스트용 가짜 APIKey.swift 만들기
        run: |
          cat > ShortPath/Data/API/APIKey.swift <<'EOF'
          import Foundation

          final class APIKey {
              static let kakaoMap = ""
              static let kakaoMap2 = ""
              static let kakaoAPI = ""
              static let kakaoAPI2 = ""
              static let releaseKakaoMap = ""
              static let releaseKakaoAPI = ""
          }
          EOF

      - name: 테스트 실행
        run: |
          SIMULATOR=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | xargs)
          echo "사용할 시뮬레이터: $SIMULATOR"
          xcodebuild test \
            -project ShortPath.xcodeproj \
            -scheme ShortPath \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            CODE_SIGNING_ALLOWED=NO
